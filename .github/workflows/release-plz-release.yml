name: Release
# Tags the commit, creates the GitHub release, and uploads to crates.io.
#
# Runs on every push to main and does nothing unless Cargo.toml names a
# version that is not on crates.io. That is what makes merging the release
# pull request the act that publishes: the merge is the only thing that moves
# the version.
#
# There is no test gate here, and that is deliberate rather than an omission.
# This job never had a gate: it was written before either repository had a ruleset, and published on any push to main.
# main now has a ruleset requiring lint, docs, msrv, integration and the test
# matrix, so an untested commit cannot reach main in the first place. Removing
# that ruleset without restoring a gate would leave this publishing whatever
# lands on main.

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run-tag:
        description: >-
          An existing tag of this repo, e.g. v0.6.6. Runs only the dog-release
          dry run against it: builds every target this dog builds for and
          prints the hashes, uploads nothing, opens no pull request, and skips
          release-plz.
        type: string
        default: ""

concurrency:
  group: release-plz-release
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish to crates.io
    # A dry run of dog-release must not also run release-plz.
    if: inputs.dry-run-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # An environment, so a required reviewer can be added here if this ever
    # wants a human gate between merging and spending a version number.
    # Inert until one is configured.
    environment: crates-io
    outputs:
      # `releases_created` is the string 'true' or 'false'. `releases` is the
      # JSON array of what was released, each with its `tag`.
      released: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[]')[0].tag }}
    steps:
      # Every action in these two files is pinned by commit, unlike test.yml's,
      # which use moving tags. These jobs hold RELEASE_PLZ_TOKEN and
      # CARGO_REGISTRY_TOKEN; test.yml's hold neither. A mutable tag in a job
      # with an upload token is a different risk from one in a job that only
      # runs tests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # release-plz needs the history to know what is already released.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # That token is write-capable, and without this the checkout writes
          # it into .git/config, where every later step in the job can read it.
          # release-plz pushes its branch, its commits and its tags over the
          # GitHub API rather than the git CLI, so nothing here needs it
          # persisted. The old release-plz.yml set this and said so; it was
          # lost moving to zendriver-rs's shape, which does not set it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # This action normally reads its toolchain from its own git ref, and
          # pinning by SHA replaces that ref with a hash it cannot parse. It
          # fails with "'toolchain' is a required input" rather than defaulting,
          # so the pin and this line go together.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Same commit pin as release-plz-pr.yml, for the same reason.
      - id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Builds the bare binary for every target shep ships for except Windows,
  # attaches each to the release release-plz just made, and opens the pull
  # request on shep-pm/shep that sets this row's version and hashes in the
  # index. A person merging that pull request is the review.
  #
  # Windows is named in `skip-targets` below rather than dropped from the
  # matrix here: this dog is Unix only and does not compile for
  # x86_64-pc-windows-msvc, and the callee's own input is what drops a target
  # from its matrix. Its row then hashes the rest, and `shep install` builds
  # from source on the skipped target.
  #
  # Called from here, gated on release-plz's outputs, because a release made
  # with a GITHUB_TOKEN fires no `release: published` event for a separate
  # workflow to listen to. Nothing runs when release-plz released nothing,
  # which is every push to main that does not merge a release pull request.
  #
  # Pinned by commit, like every action in this file: the callee gets
  # SHEP_INDEX_TOKEN and write access to this repository's releases.
  # a7f820b is shep-pm/shep#1577, the merge that added the `skip-targets`
  # input, and it is the floor for this pin: GitHub refuses a `with:` key the
  # callee does not declare, so a pin older than it fails both jobs below
  # before either builds. The workflow itself came in at 3e217f9
  # (shep-pm/shep#1463). Bump it on purpose when the workflow changes.
  #
  # SHEP_INDEX_TOKEN has to exist as a repository secret: a GitHub App
  # installation token or a PAT that can push a branch and open a pull
  # request on shep-pm/shep. The callee cannot do the latter with GITHUB_TOKEN.
  dog-release:
    name: Ship prebuilt binaries
    needs: release-plz-release
    if: needs.release-plz-release.outputs.released == 'true'
    permissions:
      contents: write
      actions: read
    uses: shep-pm/shep/.github/workflows/dog-release.yml@a7f820b77087377bd254e919e859e611a2e90264
    with:
      package: shep-deploy
      tag: ${{ needs.release-plz-release.outputs.tag }}
      skip-targets: x86_64-pc-windows-msvc
    secrets:
      index-token: ${{ secrets.SHEP_INDEX_TOKEN }}

  # Dispatch with `dry-run-tag` set to check the build-and-hash step against
  # an existing tag without waiting for a real release. The callee's `dry-run`
  # builds every target except those named in `skip-targets`, prints the
  # hashes, uploads nothing and opens no pull request, so it needs no index
  # token. It is pinned to the same commit as the job above, and passes the
  # same `skip-targets`.
  dog-release-dry-run:
    name: Dry-run prebuilt binaries
    if: inputs.dry-run-tag != ''
    permissions:
      contents: write
      actions: read
    uses: shep-pm/shep/.github/workflows/dog-release.yml@a7f820b77087377bd254e919e859e611a2e90264
    with:
      package: shep-deploy
      tag: ${{ inputs.dry-run-tag }}
      skip-targets: x86_64-pc-windows-msvc
      dry-run: true
